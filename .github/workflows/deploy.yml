name: Deploy

# Production deployment to Vercel, gated on a green CI run on main.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       - Vercel account token
#   VERCEL_ORG_ID      - team_13HYz3F0k53qc42lgJpbRn7j (see .vercel/project.json)
#   VERCEL_PROJECT_ID  - prj_gPMsG9svs1d4iCf4qatXSx3iOXb0 (see .vercel/project.json)
# If this project's Vercel Git integration is already deploying every push,
# disable it in Vercel (Project Settings > Git) so deployments are not doubled.
# Runtime secrets (SUPABASE_URL, SUPABASE_KEY, FRONTEND_URL) stay in the
# Vercel project's environment variables, not in GitHub.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://pcwa-back.vercel.app/docs
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js (for the Vercel CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
